<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>滚蛋吧坏情绪：疗愈直播间</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#fdf7f2;color:#6d6272;
}
#app{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:
    radial-gradient(circle at 16% 10%, rgba(255,226,236,.55), transparent 48%),
    radial-gradient(circle at 86% 90%, rgba(214,236,228,.55), transparent 48%),
    linear-gradient(160deg,#fdf7f2 0%,#f7f3fa 50%,#f0f8f4 100%);
}
canvas#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{
  position:absolute;top:0;left:0;right:0;height:64px;
  display:flex;align-items:center;gap:7px;padding:9px 12px;
  pointer-events:none;opacity:0;transition:opacity .4s;z-index:8;
}
#hud.show{opacity:1}
.hud-chip{
  background:rgba(255,255,255,.76);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.95);border-radius:14px;padding:5px 10px;
  display:flex;flex-direction:column;align-items:center;min-width:62px;
  box-shadow:0 3px 12px rgba(160,145,175,.1);
}
.hud-chip span{font-size:9px;color:#b4a8bc;letter-spacing:.1em;line-height:1.4}
.hud-chip b{font-size:14px;color:#6d6272;font-variant-numeric:tabular-nums;line-height:1.3}
.hud-chip.lucky b{color:#e8a020}

#topRight{
  position:absolute;top:12px;right:12px;display:flex;gap:6px;
  opacity:0;pointer-events:none;transition:opacity .4s;z-index:9;
}
#topRight.show{opacity:1;pointer-events:auto}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#8a7e94;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(160,145,175,.1);transition:transform .15s;
}
.icon-btn:active{transform:scale(.92)}
.text-btn{
  height:36px;padding:0 13px;border-radius:18px;
  border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#8a7e94;font-size:11px;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 3px 12px rgba(160,145,175,.1);transition:transform .15s;white-space:nowrap;
}
.text-btn:active{transform:scale(.94)}

#danmuLayer{
  position:absolute;top:68px;left:0;right:0;height:34px;
  pointer-events:none;overflow:hidden;z-index:7;
  opacity:0;transition:opacity .4s;
}
#danmuLayer.show{opacity:1}
.danmu-float{
  position:absolute;left:0;top:0;white-space:nowrap;
  padding:3px 11px;border-radius:11px;font-size:11px;line-height:1.5;
  background:rgba(255,255,255,.72);color:#a498ac;
  box-shadow:0 2px 8px rgba(160,145,175,.1);
  animation:danmuFloat linear forwards;
}
.danmu-float.gift{
  background:linear-gradient(135deg,rgba(255,236,200,.88),rgba(255,224,236,.88));
  color:#c08a5a;
}
.danmu-float.bad{
  background:linear-gradient(135deg,rgba(232,224,234,.88),rgba(222,214,228,.88));
  color:#8a6e8a;
}
@keyframes danmuFloat{
  from{transform:translateX(-100%);opacity:0}
  8%{opacity:1}
  92%{opacity:1}
  to{transform:translateX(calc(100vw + 100%));opacity:0}
}

#introHint{
  position:absolute;left:50%;top:46%;
  transform:translate(-50%,-50%) scale(.82);
  padding:18px 28px;max-width:80vw;
  background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(255,248,252,.97));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,1);
  border-radius:24px;
  font-size:16px;font-weight:600;color:#6d6272;letter-spacing:.08em;
  text-align:center;line-height:1.65;
  box-shadow:0 16px 44px rgba(160,145,175,.26),inset 0 1px 0 #fff;
  opacity:0;pointer-events:none;z-index:12;
  transition:opacity .55s ease,transform .55s cubic-bezier(.34,1.56,.64,1);
}
#introHint.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

#comboBadge{
  position:absolute;bottom:118px;left:50%;transform:translateX(-50%) scale(.6);
  padding:5px 16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(255,220,230,.92),rgba(240,200,220,.92));
  color:#b06a88;font-size:12px;font-weight:600;letter-spacing:.1em;
  box-shadow:0 4px 14px rgba(200,140,170,.22);
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:6;
}
#comboBadge.show{opacity:1;transform:translateX(-50%) scale(1)}

/* 观众提问弹窗 */
#questionOverlay{
  position:absolute;inset:0;z-index:30;
  display:none;align-items:center;justify-content:center;
  background:rgba(250,247,252,.82);backdrop-filter:blur(10px);
  padding:22px;
}
#questionOverlay.show{display:flex}
.question-card{
  width:100%;max-width:350px;
  background:linear-gradient(180deg,#fff,#fdf8fc);
  border-radius:24px;padding:22px 20px 18px;
  box-shadow:0 22px 60px rgba(160,140,180,.26);
  animation:qIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes qIn{from{opacity:0;transform:scale(.88) translateY(16px)}to{opacity:1;transform:none}}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.q-avatar{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ffd0e0,#d8c8f0);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 3px 10px rgba(200,170,200,.25);
}
.q-meta{flex:1;text-align:left}
.q-name{font-size:12px;font-weight:700;color:#7d7088}
.q-tag{font-size:9px;color:#c0b0c8;letter-spacing:.08em;margin-top:1px}
.q-text{
  font-size:14px;line-height:1.7;color:#5f5468;
  background:rgba(248,244,252,.9);border-radius:14px;
  padding:13px 14px;margin-bottom:14px;text-align:left;
}
.q-options{display:flex;flex-direction:column;gap:8px}
.q-option{
  width:100%;padding:12px 14px;border-radius:14px;
  border:1px solid rgba(200,180,215,.4);
  background:rgba(255,255,255,.9);
  font-size:13px;line-height:1.55;color:#6d6272;
  text-align:left;cursor:pointer;
  transition:all .18s;
}
.q-option:active{transform:scale(.97);background:#faf5ff}
.q-option:hover{border-color:#d8b8e8}

/* 果篮商店 */
#shopScreen{background:linear-gradient(170deg,rgba(255,250,242,.97),rgba(248,246,255,.97))}
.shop-balance{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:20px;font-size:13px;color:#8a7e94;
}
.shop-balance b{font-size:22px;color:#e8a020;font-variant-numeric:tabular-nums}
.shop-grid{
  display:flex;flex-direction:column;gap:10px;
  width:100%;max-width:350px;max-height:60vh;overflow-y:auto;padding:2px;
}
.shop-card{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,1);
  border-radius:17px;padding:13px 14px;
  box-shadow:0 4px 16px rgba(165,148,178,.1);
}
.shop-icon{
  width:44px;height:44px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  background:linear-gradient(135deg,#fff0d8,#ffe0e8);
}
.shop-info{flex:1;text-align:left}
.shop-name{font-size:13px;font-weight:700;color:#7d7088;margin-bottom:2px}
.shop-desc{font-size:10px;color:#b4a8bc;line-height:1.45}
.shop-buy{
  padding:7px 13px;border-radius:13px;border:none;cursor:pointer;
  font-size:11px;font-weight:600;
  background:linear-gradient(135deg,#ffd76e,#ffb0c8);color:#7a5a3a;
  box-shadow:0 3px 10px rgba(240,190,180,.3);
  white-space:nowrap;flex-shrink:0;
}
.shop-buy:disabled{
  background:#e8e2ec;color:#b4a8bc;box-shadow:none;cursor:not-allowed;
}

/* 通用页面 */
.screen{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s ease;padding:24px;
}
.screen.active{opacity:1;pointer-events:auto}

#homeScreen{
  background:
    radial-gradient(circle at 50% 26%, rgba(255,255,255,.85), transparent 60%),
    linear-gradient(170deg,rgba(255,247,250,.94),rgba(246,248,255,.94));
}
.home-title{text-align:center;margin-bottom:30px}
.home-title h1{
  font-size:29px;font-weight:800;letter-spacing:.1em;
  background:linear-gradient(135deg,#f2a6bf,#b79be2,#8cc9bb);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.home-title p{margin-top:10px;font-size:11px;letter-spacing:.55em;text-indent:.55em;color:#beb2c6}
.home-buttons{display:flex;flex-direction:column;gap:10px}
.main-btn{
  width:208px;height:47px;border:none;border-radius:24px;
  font-size:14px;font-weight:600;letter-spacing:.16em;text-indent:.16em;
  color:#7d7088;cursor:pointer;background:rgba(255,255,255,.9);
  box-shadow:0 5px 18px rgba(165,148,178,.14),inset 0 1px 0 #fff;
  transition:transform .18s;
}
.main-btn:active{transform:scale(.96)}
.main-btn.primary{
  background:linear-gradient(135deg,#ffbfd2,#cfaeee);color:#fff;
  box-shadow:0 8px 24px rgba(208,158,200,.32),inset 0 1px 0 rgba(255,255,255,.45);
}
.main-btn.lucky-btn{
  background:linear-gradient(135deg,#ffe8a0,#ffd0d8);color:#8a6a3a;
}

.back-btn{
  position:absolute;top:16px;left:15px;height:34px;padding:0 15px;border-radius:17px;
  border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.82);
  color:#8a7e94;font-size:12px;cursor:pointer;
  box-shadow:0 3px 12px rgba(160,145,175,.1);
}
.page-title{font-size:20px;font-weight:700;letter-spacing:.2em;text-indent:.2em;color:#6d6272;margin-bottom:20px}

#dataScreen{background:linear-gradient(170deg,rgba(253,247,242,.96),rgba(246,248,255,.96))}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:330px}
.data-card{
  background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.98);
  border-radius:17px;padding:16px 11px;text-align:center;
  box-shadow:0 5px 18px rgba(165,148,178,.1);
}
.data-card span{display:block;font-size:10px;color:#b4a8bc;letter-spacing:.12em;margin-bottom:7px}
.data-card b{font-size:20px;color:#8d7ba2;font-variant-numeric:tabular-nums}

#collectionScreen{background:linear-gradient(170deg,rgba(246,251,248,.96),rgba(253,247,251,.96))}
.tabs{display:flex;gap:9px;margin-bottom:18px}
.tab{
  padding:8px 20px;border-radius:19px;border:none;cursor:pointer;
  font-size:12px;letter-spacing:.1em;background:rgba(255,255,255,.6);color:#ac9fb5;transition:all .25s;
}
.tab.active{background:linear-gradient(135deg,#ffc9dc,#cdaeee);color:#fff;box-shadow:0 5px 16px rgba(200,165,215,.28)}
.pair-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  width:100%;max-width:370px;max-height:64vh;overflow-y:auto;padding:2px;
}
.pair-card{
  background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,1);
  border-radius:17px;padding:11px 7px 9px;text-align:center;
  box-shadow:0 4px 14px rgba(165,148,178,.1);
  position:relative;
}
.pair-card.locked{opacity:.68}
.pair-card.rare{border-color:rgba(200,170,230,.6)}
.pair-card.legend{border-color:rgba(240,190,120,.75);box-shadow:0 4px 18px rgba(240,190,120,.2)}
.pair-rarity{
  position:absolute;top:7px;right:8px;
  font-size:8px;letter-spacing:.08em;padding:1px 5px;border-radius:6px;
}
.pair-rarity.rare{background:#e8dcf8;color:#8a6aa8}
.pair-rarity.legend{background:#fff0c8;color:#b08820}
.pair-icons{display:flex;justify-content:center;align-items:center;gap:4px;margin-bottom:6px}
.pair-icon{width:38px;height:38px}
.pair-icon svg{width:100%;height:100%;display:block}
.silhouette{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 36% 32%,#e8e2ec,#cfc6d8)}
.pair-name{font-size:11px;font-weight:600;color:#7d7088;line-height:1.4}
.pair-desc{font-size:8px;color:#beb2c6;margin-top:2px;line-height:1.4}

#achievementScreen{background:linear-gradient(170deg,rgba(255,248,240,.96),rgba(248,246,255,.96))}
.achievement-list{
  display:flex;flex-direction:column;gap:9px;
  width:100%;max-width:340px;max-height:66vh;overflow-y:auto;padding:2px;
}
.ach-card{
  display:flex;align-items:center;gap:11px;
  background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.98);
  border-radius:15px;padding:11px 13px;
  box-shadow:0 4px 14px rgba(165,148,178,.1);
}
.ach-card.locked{opacity:.55;filter:grayscale(.6)}
.ach-icon{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ffd76e,#ffb0c8);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.ach-card.locked .ach-icon{background:linear-gradient(135deg,#e0d8e4,#d0c8d6)}
.ach-content{flex:1;text-align:left}
.ach-name{font-size:13px;font-weight:600;color:#7d7088;margin-bottom:2px}
.ach-desc{font-size:10px;color:#b4a8bc;line-height:1.4}
.ach-status{font-size:10px;color:#c8a8d8;flex-shrink:0}

#resultScreen{background:rgba(250,247,252,.93);backdrop-filter:blur(8px)}
.result-card{
  width:100%;max-width:326px;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(252,248,255,.98));
  border-radius:25px;padding:24px 21px 21px;text-align:center;
  box-shadow:0 20px 50px rgba(165,148,178,.2);
  animation:cardIn .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.result-title{font-size:18px;font-weight:700;letter-spacing:.12em;text-indent:.12em;color:#8d7ba2;margin-bottom:7px}
.result-sub{font-size:12px;color:#b4a8bc;margin-bottom:18px;line-height:1.6;min-height:19px}
.result-stats{display:flex;justify-content:space-around;margin-bottom:18px}
.rs-item{display:flex;flex-direction:column;gap:4px}
.rs-item span{font-size:9px;color:#beb2c6;letter-spacing:.08em}
.rs-item b{font-size:18px;color:#8d7ba2;font-variant-numeric:tabular-nums}
.result-reward{
  display:flex;justify-content:center;gap:18px;margin-bottom:18px;flex-wrap:wrap;
  padding:14px 0;border-top:1px dashed rgba(205,190,215,.42);border-bottom:1px dashed rgba(205,190,215,.42);
}
.reward-item{animation:rewardPop .65s cubic-bezier(.34,1.56,.64,1) both}
.reward-item:nth-child(2){animation-delay:.14s}
.reward-item:nth-child(3){animation-delay:.28s}
@keyframes rewardPop{from{opacity:0;transform:scale(.35) rotate(-14deg)}to{opacity:1;transform:none}}
.reward-icon{width:50px;height:50px;margin:0 auto 5px}
.reward-icon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 10px rgba(220,185,215,.32))}
.reward-name{font-size:11px;color:#8d7ba2;letter-spacing:.06em}

.achievement-toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-30px);
  display:flex;align-items:center;gap:11px;
  padding:11px 18px 11px 13px;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,245,220,.97),rgba(255,230,240,.97));
  border:1px solid rgba(255,220,180,.95);
  box-shadow:0 10px 30px rgba(220,170,180,.3);
  z-index:99999;opacity:0;transition:all .5s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
}
.achievement-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.at-icon{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ffd76e,#ffb0c8);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.at-label{font-size:9px;color:#c08a5a;letter-spacing:.15em;margin-bottom:2px}
.at-name{font-size:14px;font-weight:700;color:#8a6e5a;letter-spacing:.05em}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-chip"><span>天数</span><b id="hudDay">1</b></div>
    <div class="hud-chip"><span>热度</span><b id="hudHeat">0</b></div>
    <div class="hud-chip"><span>粉丝</span><b id="hudFans">0</b></div>
    <div class="hud-chip lucky"><span>好运果</span><b id="hudLucky">0</b></div>
  </div>

  <div id="topRight">
    <button class="icon-btn" id="btnMute" title="静音">🔊</button>
    <button class="text-btn" id="btnShop">果篮</button>
    <button class="text-btn" id="btnCollection">图鉴</button>
  </div>

  <div id="danmuLayer"></div>
  <div id="introHint"></div>
  <div id="comboBadge">连击 ×2</div>

  <!-- 观众提问 -->
  <div id="questionOverlay">
    <div class="question-card">
      <div class="q-header">
        <div class="q-avatar" id="qAvatar">🌙</div>
        <div class="q-meta">
          <div class="q-name" id="qName">夜猫子</div>
          <div class="q-tag">连麦提问中</div>
        </div>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="q-options" id="qOptions"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="homeScreen" class="screen active">
    <div class="home-title">
      <h1>滚蛋吧坏情绪</h1>
      <p>疗 愈 直 播 间</p>
    </div>
    <div class="home-buttons">
      <button class="main-btn primary" id="btnStart">开 始 直 播</button>
      <button class="main-btn lucky-btn" id="btnShopHome">果 篮 商 店</button>
      <button class="main-btn" id="btnData">直 播 数 据</button>
      <button class="main-btn" id="btnCollectionHome">花 果 图 鉴</button>
      <button class="main-btn" id="btnAchievements">成 就</button>
    </div>
  </div>

  <!-- 数据 -->
  <div id="dataScreen" class="screen">
    <button class="back-btn" id="btnDataBack">‹ 返回</button>
    <div class="page-title">直播数据</div>
    <div class="data-grid">
      <div class="data-card"><span>累计直播天数</span><b id="statDays">0</b></div>
      <div class="data-card"><span>总热度值</span><b id="statHeat">0</b></div>
      <div class="data-card"><span>当前粉丝数</span><b id="statFans">0</b></div>
      <div class="data-card"><span>消除坏情绪</span><b id="statPopped">0</b></div>
      <div class="data-card"><span>已解锁花果</span><b id="statUnlocked">0</b></div>
      <div class="data-card"><span>最高天数</span><b id="statBest">0</b></div>
      <div class="data-card"><span>累计好运果</span><b id="statLucky">0</b></div>
      <div class="data-card"><span>已兑换道具</span><b id="statItems">0</b></div>
    </div>
  </div>

  <!-- 图鉴 -->
  <div id="collectionScreen" class="screen">
    <button class="back-btn" id="btnCollectionBack">‹ 返回</button>
    <div class="page-title">花果图鉴</div>
    <div class="tabs">
      <button class="tab active" id="tabUnlocked">已收集</button>
      <button class="tab" id="tabAll">全部</button>
    </div>
    <div class="pair-grid" id="collectionGrid"></div>
  </div>

  <!-- 果篮商店 -->
  <div id="shopScreen" class="screen">
    <button class="back-btn" id="btnShopBack">‹ 返回</button>
    <div class="page-title">果篮商店</div>
    <div class="shop-balance">好运果余额 <b id="shopBalance">0</b></div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>

  <!-- 成就 -->
  <div id="achievementScreen" class="screen">
    <button class="back-btn" id="btnAchievementBack">‹ 返回</button>

function randInt(a,b){ return Math.floor(a+Math.random()*(b-a+1)); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function formatNum(n){ n=Math.round(n); if(n>=10000) return (n/1000).toFixed(0)+'k'; if(n>=1000) return (n/1000).toFixed(1)+'k'; return String(n); }

function stopDanmu(){ if(danmuTimer){ clearInterval(danmuTimer); danmuTimer=null; } danmuLayer.innerHTML=''; danmuActive=0; danmuTrackIdx=0; }

function triggerQuestion(){

  const q=CONFIG.questions[randInt(0,CONFIG.questions.length-1)];
  state.questionOpen=true;
  state.paused=true;

  qAvatar.textContent=q.avatar;
  qName.textContent=q.name;
  qText.textContent=q.text;
  qOptions.innerHTML='';

  q.options.forEach(function(opt){
    const btn=document.createElement('button');
    btn.className='q-option';
    btn.textContent=opt.text;
    btn.addEventListener('click',function(){
      AudioSys.click();
      // 结算
      const heatGain=opt.heat;
      const fanGain=opt.fans;
      state.heat+=heatGain;
      state.fans+=fanGain;
      saveData.totalFans=state.fans;
      saveData.answeredCount+=1;
      state.dayStats.answered+=1;
      state.dayStats.fansGained+=fanGain;
      if(state.heat>state.dayStats.heatPeak) state.dayStats.heatPeak=state.heat;
      persist();
      addFloat(CW/2,CH*0.3,'+'+heatGain+' 热度','#e88a9a');
      addFloat(CW/2,CH*0.3-28,'+'+fanGain+' 粉','#c08a6a');
      spawnParticles(CW/2,CH*0.3,'#ffd0e0',18);

      qOptions.innerHTML='<div style="text-align:center;font-size:12px;color:#b4a8bc;padding:14px 0;line-height:1.7">主播回应了 '+q.name+'<br>+'+heatGain+' 热度 · +'+fanGain+' 粉</div>';
      setTimeout(function(){
        questionOverlay.classList.remove('show');
        state.questionOpen=false;
        state.paused=false;
        checkAchievements();
      },1100);
    });
    qOptions.appendChild(btn);
  });

  questionOverlay.classList.add('show');
}

/* ============================================================
   十九、开始一天
   ============================================================ */
function startDay(day){
  state.currentDay=day;
  state.phase='playing';
  state.paused=false;
  state.questionOpen=false;
  state.dragging=null;
  state.pointerId=null;
  state.positiveCooldown=0;

  state.heat=0; state.heatDisplay=0;
  state.fans=saveData.totalFans||0; state.fansDisplay=saveData.totalFans||0;
  lastHeat=null; lastFans=null;

  state.combo=0; state.comboTimer=0;
  state.dayStats={popped:0,fansGained:0,heatPeak:0,answered:0};
  state.fruitCollected=false;

  state.bubbles=[]; state.particles=[]; state.floats=[]; state.gifts=[];

  state.tree.active=false; state.tree.visible=false; state.tree.t=0;

  const cfg=getDayConfig(day);
  const pair=pickPairForDay();
  state.todayPair=pair;
  state.todayFlower=pair.flower; state.todayFlowerType=pair.flowerType;
  state.todayFruit=pair.fruit; state.todayFruitType=pair.fruitType;
  state.hasFruit=cfg.hasFruit;

  if(cfg.hasFruit) saveData.daysSinceLucky=0; else saveData.daysSinceLucky=(saveData.daysSinceLucky||0)+1;
  persist();

  state.eventTimer=CONFIG.eventIntervalMin+Math.random()*(CONFIG.eventIntervalMax-CONFIG.eventIntervalMin);
  state.questionTimer=CONFIG.gameplay.questionIntervalMin+Math.random()*(CONFIG.gameplay.questionIntervalMax-CONFIG.gameplay.questionIntervalMin);

  const negPool=shuffle(CONFIG.negativeWords.slice());
  const posPool=shuffle(CONFIG.positiveWords.slice());
  const negWords=negPool.slice(0,Math.min(cfg.negTypes,negPool.length));
  const posWords=posPool.slice(0,Math.min(cfg.posTypes,posPool.length));

  const list=[];
  for(let i=0;i<negWords.length;i++){ for(let p=0;p<cfg.negPairs;p++){ list.push({type:'negative',word:negWords[i]}); list.push({type:'negative',word:negWords[i]}); } }
  for(let i=0;i<posWords.length;i++) list.push({type:'positive',word:posWords[i]});

  const total=list.length+(cfg.hasFruit?1:0);
  const r=computeRadius(total);
  const bubbleList=[];
  for(let i=0;i<list.length;i++) bubbleList.push(makeBubble(list[i].type,list[i].word,r));
  if(cfg.hasFruit) bubbleList.push(makeFruit(r*1.08));

  layoutBubbles(bubbleList);
  bubbleList.forEach(function(b){ b.targetY=b.y; b.y=-b.r-40; b.entering=true; b.enterT=0; b.enterDelay=999; });
  state.bubbles=bubbleList;

  hudDayEl.textContent=String(day);
  hudHeatEl.textContent='0';
  hudFansEl.textContent=formatNum(saveData.totalFans||0);
  hudLuckyEl.textContent=String(saveData.luckyCount);
  comboBadgeEl.classList.remove('show');

  showHud(true);
  hideAllScreens();
  AudioSys.startBgm();

  let hint;
  if(cfg.posTypes>0&&cfg.hasFruit) hint='小心暖色气泡，那是好情绪\n还要找到金色好运果';
  else if(cfg.posTypes>0) hint='暖色气泡是好情绪，不要碰碎它';
  else if(cfg.hasFruit) hint='把两个相同的坏情绪拖到一起\n再收集金色好运果';
  else hint='把两个相同的坏情绪拖到一起';

  showIntroHint(hint,function(){
    startDanmu();
    state.bubbles.forEach(function(b,i){ b.enterT=0; b.enterDelay=i*0.05; });
  });
}

/* ============================================================
   二十、连击
   ============================================================ */
function getComboMultiplier(){ if(state.combo>=15) return 2.2; if(state.combo>=10) return 1.8; if(state.combo>=6) return 1.5; if(state.combo>=3) return 1.2; return 1; }
function addCombo(){ state.combo++; state.comboTimer=CONFIG.gameplay.comboWindow; if(state.combo>saveData.maxComboEver){ saveData.maxComboEver=state.combo; persist(); } updateComboBadge(); checkAchievements(); }
function resetCombo(){ state.combo=0; state.comboTimer=0; updateComboBadge(); }

/* ============================================================
   二十一、消除
   ============================================================ */
function popPair(a,b){
  if(a.popping||b.popping) return;
  a.popping=true; a.popT=0; b.popping=true; b.popT=0;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  spawnParticles(mx,my,'hsl('+a.hue+','+a.sat+'%,'+(a.light-8)+'%)',14);
  spawnParticles(mx,my,'rgba(255,255,255,.88)',7);
  AudioSys.pop();
  addCombo();
  const mult=getComboMultiplier();
  const g=CONFIG.gameplay;
  let heatGain=Math.round(randInt(g.heatPerPop[0],g.heatPerPop[1])*mult);
  let fanGain=Math.round(randInt(g.fansPerPop[0],g.fansPerPop[1])*mult);
  if(state.activeBuffs.doubleHeat) heatGain*=2;
  if(state.activeBuffs.extraFans) fanGain=Math.round(fanGain*1.5);

  state.heat+=heatGain; state.fans+=fanGain; saveData.totalFans=state.fans;
  state.dayStats.popped+=1; state.dayStats.fansGained+=fanGain;
  if(state.heat>state.dayStats.heatPeak) state.dayStats.heatPeak=state.heat;
  persist();
  addFloat(mx,my-10,'+'+heatGain,'#d990a8');
  if(state.combo>=3) addFloat(mx,my-30,'连击 ×'+state.combo,'#c08a6a');
  setTimeout(checkDayEnd,280);
}

function collectFruit(b){
  if(b.collected) return;
  b.collected=true; b.popping=true; b.popT=0; state.fruitCollected=true;
  spawnParticles(b.x,b.y,'#ffd76e',24); spawnParticles(b.x,b.y,'#fff3c4',10);
  AudioSys.collect();
  state.heat+=CONFIG.gameplay.fruitHeatBonus;
  if(state.heat>state.dayStats.heatPeak) state.dayStats.heatPeak=state.heat;
  addFloat(b.x,b.y-b.r-10,'好运果 +1','#d9a020');
  setTimeout(checkDayEnd,320);
}

/* ============================================================
   二十二、撞好情绪（坏情绪不消失）
   ============================================================ */
function onHitPositive(bad,good){
  if(state.positiveCooldown>0||state.phase!=='playing') return;
  state.positiveCooldown=CONFIG.gameplay.positiveCooldown;
  good.popping=true; good.popT=0; good.flash=1;

  const dx=bad.x-good.x,dy=bad.y-good.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  const minD=good.r+bad.r+6;
  bad.x=clamp(good.x+(dx/d)*minD,bad.r,CW-bad.r);
  bad.y=clamp(good.y+(dy/d)*minD,CONFIG.gameplay.bubbleTopLimit+bad.r,CH-CONFIG.gameplay.bubbleBottomMargin-bad.r);

  spawnParticles(good.x,good.y,'hsl('+good.hue+','+good.sat+'%,'+(good.light-6)+'%)',14);
  spawnParticles(good.x,good.y,'rgba(255,255,255,.92)',10);
  AudioSys.wrong();

  const g=CONFIG.gameplay;
  const fanLoss=randInt(g.fanLossOnHit[0],g.fanLossOnHit[1]);
  const heatLoss=randInt(g.heatLossOnHit[0],g.heatLossOnHit[1]);
  state.fans=Math.max(0,state.fans-fanLoss); saveData.totalFans=state.fans;
  state.heat=Math.max(0,state.heat-heatLoss); persist();

  addFloat(good.x,good.y-20,'-'+fanLoss+' 粉','#c08a8a');
  addFloat(good.x+24,good.y-42,'-'+heatLoss+' 热度','#c08a8a');
  for(let i=0;i<2;i++) addDanmu(CONFIG.badDanmuTexts[randInt(0,CONFIG.badDanmuTexts.length-1)],'bad');

  // 连击护符：第一次断连击时保护
  if(state.activeBuffs.comboShield){
    state.activeBuffs.comboShield=false;
    addFloat(CW/2,CH*0.4,'连击护符生效！','#8ab0e8');
  } else {
    resetCombo();
  }

  const word=good.word,r=good.r;
  setTimeout(function(){
    if(state.phase!=='playing') return;
    const nb=makeBubble('positive',word,r); nb.fontSize=fitFontSize(word,r);
    const top=CONFIG.gameplay.bubbleTopLimit,bot=CH-CONFIG.gameplay.bubbleBottomMargin;
    for(let t=0;t<100;t++){ nb.x=nb.r+10+Math.random()*(CW-nb.r*2-20); nb.y=top+nb.r+Math.random()*(bot-top-nb.r*2); let ok=true; for(let i=0;i<state.bubbles.length;i++){ const ob=state.bubbles[i]; if(ob.popping||ob===state.dragging||ob.entering) continue; const ddx=ob.x-nb.x,ddy=ob.y-nb.y; if(Math.sqrt(ddx*ddx+ddy*ddy)<ob.r+nb.r+4){ ok=false; break; } } if(ok) break; }
    nb.entering=false; state.bubbles.push(nb);
  },1500);
}

function checkDayEnd(){
  if(state.phase!=='playing') return;
  for(let i=0;i<state.bubbles.length;i++){ const b=state.bubbles[i]; if(b.type==='negative'&&!b.popping) return; }
  if(state.hasFruit&&!state.fruitCollected) return;
  finishSuccess();
}

/* ============================================================
   二十三、通关
   ============================================================ */
function finishSuccess(){
  if(state.phase!=='playing') return;
  state.phase='tree'; state.dragging=null; state.pointerId=null; resetCombo();
  AudioSys.complete(); stopDanmu();

  const pair=state.todayPair;
  if(saveData.unlocked.indexOf(pair.key)<0) saveData.unlocked.push(pair.key);
  if(state.fruitCollected) saveData.luckyCount+=1;
  saveData.totalHeat+=state.heat; saveData.totalFans=state.fans;
  saveData.totalPopped+=state.dayStats.popped; saveData.totalDays+=1;
  if(state.currentDay>saveData.bestDay) saveData.bestDay=state.currentDay;
  persist(); checkAchievements();

  const tree=state.tree; tree.active=true; tree.visible=true; tree.t=0;
  tree.onDone=function(){ showResult(); };
  const shape=buildTreeShape(); tree.branches=shape.branches; tree.tips=shape.tips;
}

   ============================================================ */
function showScreen(el){ const ss=document.querySelectorAll('.screen'); for(let i=0;i<ss.length;i++) ss[i].classList.remove('active'); if(el) el.classList.add('active'); }
function hideAllScreens(){ showScreen(null); }

function renderShop(){
  shopBalanceEl.textContent=saveData.luckyCount;
  let html='';
  CONFIG.shopItems.forEach(function(item){
    const owned=saveData.ownedItems.filter(function(i){ return i.id===item.id; }).length;
    const canBuy=saveData.luckyCount>=item.cost;
    html+='<div class="shop-card">';
    html+='<div class="shop-icon">'+item.icon+'</div>';
    html+='<div class="shop-info"><div class="shop-name">'+item.name+(owned?' ×'+owned:'')+'</div><div class="shop-desc">'+item.desc+'</div></div>';
    html+='<button class="shop-buy" data-id="'+item.id+'" '+(canBuy?'':'disabled')+'>'+item.cost+' 果</button>';
    html+='</div>';
  });
  shopGridEl.innerHTML=html;

  shopGridEl.querySelectorAll('.shop-buy').forEach(function(btn){
    btn.addEventListener('click',function(){
      const id=btn.getAttribute('data-id');
      const item=CONFIG.shopItems.filter(function(i){ return i.id===id; })[0];
      if(!item||saveData.luckyCount<item.cost) return;
      AudioSys.collect();

      if(item.type==='unlockCommon'||item.type==='unlockRare'||item.type==='unlockLegend'){
        const locked=CONFIG.pairs.filter(function(p){ return saveData.unlocked.indexOf(p.key)<0 && p.rarity===item.type.replace('unlock','').toLowerCase(); });
        const pool=locked.length>0?locked:CONFIG.pairs.filter(function(p){ return p.rarity==='common'; });
        if(pool.length>0){
          const pick=pool[randInt(0,pool.length-1)];
          saveData.unlocked.push(pick.key);
          saveData.luckyCount-=item.cost;
          persist();
          alert('解锁了：'+pick.flower+' · '+pick.fruit);
        } else {
          alert('这个稀有度的花果已经全部收集了');
          return;
        }
      } else {
        saveData.ownedItems.push({ id:item.id, type:item.type });
        saveData.luckyCount-=item.cost;
        persist();
        alert('获得了：'+item.name+'（下一局生效）');
      }
      renderShop();
      checkAchievements();
    });
  });
}

function applyBuffsForNewDay(){
  state.activeBuffs={comboShield:false,doubleHeat:false,extraFans:false};
  const keep=[];
  saveData.ownedItems.forEach(function(it){
    if(it.type==='comboShield'&&!state.activeBuffs.comboShield){ state.activeBuffs.comboShield=true; }
    else if(it.type==='doubleHeat'&&!state.activeBuffs.doubleHeat){ state.activeBuffs.doubleHeat=true; }
    else if(it.type==='extraFans'&&!state.activeBuffs.extraFans){ state.activeBuffs.extraFans=true; }
    else keep.push(it);
  });
  saveData.ownedItems=keep;
  persist();
}

function checkAchievements(){
  let changed=false;
  for(let i=0;i<ACHIEVEMENTS.length;i++){

}

/* ============================================================
   二十八、花果 SVG（20 组，精简但可区分）
   ============================================================ */
function flowerSVG(type){

  const p=P[type]||P.peach; let petals='';

}

/* ============================================================
   二十九、主循环
   ============================================================ */
function update(dt){
  state.time+=dt; updateHudNumbers(dt); updateParticles(dt); updateFloats(dt); updateGifts(dt);
  if(state.positiveCooldown>0) state.positiveCooldown=Math.max(0,state.positiveCooldown-dt);
  if(state.paused) return;
  if(state.comboTimer>0){ state.comboTimer-=dt; if(state.comboTimer<=0) resetCombo(); }

  if(state.tree.active){ state.tree.t+=dt; if(state.tree.t>=state.tree.duration){ state.tree.active=false; const cb=state.tree.onDone; state.tree.onDone=null; if(cb) cb(); } return; }
  if(state.phase!=='playing') return;

  state.eventTimer-=dt;
  if(state.eventTimer<=0){ triggerRandomEvent(); state.eventTimer=CONFIG.eventIntervalMin+Math.random()*(CONFIG.eventIntervalMax-CONFIG.eventIntervalMin); }

  state.questionTimer-=dt;
  if(state.questionTimer<=0){ if(Math.random()<CONFIG.gameplay.questionChance) triggerQuestion(); state.questionTimer=CONFIG.gameplay.questionIntervalMin+Math.random()*(CONFIG.gameplay.questionIntervalMax-CONFIG.gameplay.questionIntervalMin); }

  const top=CONFIG.gameplay.bubbleTopLimit,bot=CH-CONFIG.gameplay.bubbleBottomMargin;
  for(let i=0;i<state.bubbles.length;i++){
    const b=state.bubbles[i];
    if(b.entering){ if(b.popping||b===state.dragging){ b.entering=false; continue; } b.enterT+=dt; if(b.enterT<b.enterDelay) continue; const t=Math.min(1,(b.enterT-b.enterDelay)/0.65); const ease=1-Math.pow(1-t,3); b.y=-b.r-40+(b.targetY+b.r+40)*ease; if(t>=1){ b.entering=false; b.y=b.targetY; } continue; }
    if(b.popping||b===state.dragging) continue;
    b.wobble+=dt*1.3; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx); }
    if(b.x>CW-b.r){ b.x=CW-b.r; b.vx=-Math.abs(b.vx); }
    if(b.y<top+b.r){ b.y=top+b.r; b.vy=Math.abs(b.vy); }
    if(b.y>bot-b.r){ b.y=bot-b.r; b.vy=-Math.abs(b.vy); }
    if(b.flash>0) b.flash=Math.max(0,b.flash-dt*2.6);
  }
  separateBubbles();

  let changed=false;
  for(let i=0;i<state.bubbles.length;i++){ const b=state.bubbles[i]; if(b.popping){ b.popT+=dt; const k=Math.min(1,b.popT/CONFIG.gameplay.popAnimDuration); b.scale=1+k*0.95; b.alpha=1-k; if(k>=1){ b.dead=true; changed=true; } } }
  if(changed){ const keep=[]; for(let i=0;i<state.bubbles.length;i++){ if(!state.bubbles[i].dead) keep.push(state.bubbles[i]); } state.bubbles=keep; }
}

function separateBubbles(){
  const a=state.bubbles;
  for(let i=0;i<a.length;i++){ const A=a[i]; if(A.popping||A.entering||A===state.dragging) continue; for(let j=i+1;j<a.length;j++){ const B=a[j]; if(B.popping||B.entering||B===state.dragging) continue; const dx=B.x-A.x,dy=B.y-A.y; const d=Math.sqrt(dx*dx+dy*dy); const md=A.r+B.r; if(d>0.01&&d<md){ const p=(md-d)*0.5; const nx=dx/d,ny=dy/d; A.x-=nx*p; A.y-=ny*p; B.x+=nx*p; B.y+=ny*p; } } }
}

function render(){
  ctx.clearRect(0,0,CW,CH); drawAmbient(state.time); if(state.tree.visible) drawTree();
  for(let i=0;i<state.bubbles.length;i++){ const b=state.bubbles[i]; if(b===state.dragging) continue; drawBubble(b); }
  if(state.dragging&&!state.dragging.popping) drawBubble(state.dragging);
  drawParticles(); drawFloats();
  for(let i=0;i<state.gifts.length;i++) drawGift(state.gifts[i]);
}

function loop(now){ requestAnimationFrame(loop); if(!state.lastTime) state.lastTime=now; let dt=(now-state.lastTime)/1000; state.lastTime=now; if(dt>0.06) dt=0.06; if(dt<0) dt=0; update(dt); render(); }

/* ============================================================
   三十、拖拽
   ============================================================ */
function getCanvasPos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function releaseDrag(){ state.dragging=null; state.pointerId=null; }

canvas.addEventListener('pointerdown',function(e){
  if(state.phase!=='playing'||state.paused||state.tree.active||state.questionOpen) return;
  const pos=getCanvasPos(e); let hit=null;
  for(let i=state.bubbles.length-1;i>=0;i--){ const b=state.bubbles[i]; if(b.entering||b.popping||b.type!=='negative') continue; const dx=pos.x-b.x,dy=pos.y-b.y; if(dx*dx+dy*dy<=(b.r+4)*(b.r+4)){ hit=b; break; } }
  if(hit){ e.preventDefault(); state.dragging=hit; state.dragOffX=pos.x-hit.x; state.dragOffY=pos.y-hit.y; state.pointerId=e.pointerId; try{ canvas.setPointerCapture(e.pointerId); }catch(err){} AudioSys.init(); }
},{passive:false});

canvas.addEventListener('pointermove',function(e){
  if(!state.dragging) return; if(state.pointerId!==null&&e.pointerId!==state.pointerId) return; e.preventDefault();
  const pos=getCanvasPos(e); const b=state.dragging;
  b.x=clamp(pos.x-state.dragOffX,b.r,CW-b.r);
  b.y=clamp(pos.y-state.dragOffY,CONFIG.gameplay.bubbleTopLimit+b.r,CH-CONFIG.gameplay.bubbleBottomMargin-b.r);
  checkDragCollision(b);
},{passive:false});

canvas.addEventListener('pointerup',function(e){ if(state.pointerId!==null&&e.pointerId!==state.pointerId) return; releaseDrag(); });
canvas.addEventListener('pointercancel',releaseDrag);

function checkDragCollision(a){
  for(let i=0;i<state.bubbles.length;i++){ const b=state.bubbles[i]; if(b===a||b.popping||b.dead||b.entering) continue; const dx=a.x-b.x,dy=a.y-b.y; const d=Math.sqrt(dx*dx+dy*dy); if(d>=a.r+b.r) continue;
    if(b.type==='negative'&&a.word===b.word){ popPair(a,b); releaseDrag(); return; }
    if(b.type==='positive'){ onHitPositive(a,b); releaseDrag(); return; }
    if(b.type==='fruit'){ collectFruit(b); releaseDrag(); return; }
  }
}
